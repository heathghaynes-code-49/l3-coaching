[build]
  command = "npx @11ty/eleventy"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npx @11ty/eleventy --serve"
  targetPort = 8080

# Short address used in the Iron Forums Houston invitations. Temporary (302)
# so it can be pointed somewhere new after the Discovery Lunch.
[[redirects]]
  from = "/ifhouston"
  to = "/ironforums-houston#register"
  status = 302
